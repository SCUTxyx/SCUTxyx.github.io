<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <defs>
    <path id="arcTop" d="M 150,150 m -112,0 a 112,112 0 1,1 224,0" fill="none"/>
    <path id="arcBottom" d="M 150,150 m -112,0 a 112,112 0 1,0 224,0" fill="none"/>
    <radialGradient id="inner" cx="0.5" cy="0.4" r="0.8">
      <stop offset="0" stop-color="#fff" stop-opacity=".15"/>
      <stop offset="1" stop-color="#8b1a1a" stop-opacity=".12"/>
    </radialGradient>
  </defs>

  <!-- outer ring -->
  <circle cx="150" cy="150" r="142" fill="none" stroke="#8b1a1a" stroke-width="5"/>
  <circle cx="150" cy="150" r="134" fill="none" stroke="#8b1a1a" stroke-width="1.5"/>
  <circle cx="150" cy="150" r="106" fill="none" stroke="#8b1a1a" stroke-width="2"/>
  <circle cx="150" cy="150" r="72" fill="url(#inner)"/>

  <!-- school name: top arc (Chinese) -->
  <text font-family="'STKaiti','KaiTi','BiauKai','DFKai-SB',serif" font-size="24"
        fill="#8b1a1a" font-weight="bold" letter-spacing="6">
    <textPath href="#arcTop" startOffset="50%" text-anchor="middle">广东广雅中学</textPath>
  </text>

  <!-- founding year: bottom arc -->
  <text font-family="'Georgia','Times New Roman',serif" font-size="16"
        fill="#8b1a1a" letter-spacing="3">
    <textPath href="#arcBottom" startOffset="50%" text-anchor="middle">EST · 1888</textPath>
  </text>

  <!-- inner circle: 书院 style lotus/palanquin motif -->
  <circle cx="150" cy="150" r="68" fill="none" stroke="#8b1a1a" stroke-width="1" stroke-dasharray="4 3"/>
  <!-- central motif: 广雅 书院 gate/pavilion simplified -->
  <g stroke="#8b1a1a" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- roof -->
    <path d="M 108,128 Q 150,110 192,128" fill="#8b1a1a" fill-opacity=".12"/>
    <path d="M 116,132 L 150,116 L 184,132" fill="none"/>
    <!-- pillars -->
    <line x1="124" y1="134" x2="124" y2="168"/>
    <line x1="176" y1="134" x2="176" y2="168"/>
    <!-- base -->
    <line x1="112" y1="170" x2="188" y2="170"/>
    <!-- center arch -->
    <path d="M 140,168 Q 150,152 160,168" fill="none"/>
  </g>
  <!-- 园林 feel: small lotus dots -->
  <circle cx="138" cy="176" r="3" fill="#8b1a1a" opacity=".4"/>
  <circle cx="162" cy="176" r="3" fill="#8b1a1a" opacity=".4"/>
  <circle cx="150" cy="180" r="2.5" fill="#8b1a1a" opacity=".4"/>

  <!-- side decorations: 雅 characters hint -->
  <text x="72" y="156" font-family="'STKaiti','KaiTi',serif" font-size="14" fill="#8b1a1a" opacity=".5">雅</text>
  <text x="216" y="156" font-family="'STKaiti','KaiTi',serif" font-size="14" fill="#8b1a1a" opacity=".5">雅</text>
</svg>
