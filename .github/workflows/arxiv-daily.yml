name: daily-arxiv-feed

# Rebuilds the arXiv daily feed once a day (08:00 Beijing) and publishes it
# to the orphan `feed` branch. The site page (/daily.html) fetches it from
# raw.githubusercontent.com — keeping the feed separate avoids any conflicts
# with manually pushed site updates.

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: arxiv-feed
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build feed
        id: build
        run: |
          if python3 .github/scripts/build_arxiv_feed.py daily_papers.json 2>build_err.log; then
            echo "status=ok" >> "$GITHUB_OUTPUT"
          else
            echo "status=failed" >> "$GITHUB_OUTPUT"
            {
              echo "### ⚠️ arXiv feed build failed"
              echo ""
              echo '```'
              tail -25 build_err.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish to feed branch
        if: steps.build.outputs.status == 'ok'
        run: |
          git config user.name  "arxiv-feed-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp daily_papers.json /tmp/daily_papers.json
          git fetch origin 'refs/heads/feed:refs/remotes/origin/feed' || echo "no feed branch yet"
          if git rev-parse --verify origin/feed >/dev/null 2>&1; then
            git checkout -f -B feed origin/feed
            mv -f /tmp/daily_papers.json daily_papers.json
          else
            git checkout --orphan feed
            git rm -rf --cached . >/dev/null 2>&1 || true
            mv /tmp/daily_papers.json daily_papers.json
          fi
          git add daily_papers.json
          git commit -m "arXiv feed update $(date -u +%F)" || echo "feed unchanged"
          git push origin feed

      - name: Report build failure
        if: steps.build.outputs.status == 'failed'
        run: |
          echo "### ⚠️ Feed build failed — the site keeps yesterday's data" >> "$GITHUB_STEP_SUMMARY"
          exit 1
